name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: hath-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: net/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - run: npm ci

      - run: npm test

      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build production image
        run: docker build --target production -t hath-prod .

  publish:
    needs: container
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hath:latest
            ghcr.io/${{ github.repository_owner }}/hath:${{ github.sha }}

  release-desktop:
    needs: ci
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            net_target: linux-amd64
            rust_targets: ""
            build_args: "--bundles appimage"
            installer_glob: "src-tauri/target/release/bundle/appimage/*.AppImage"
            installer_name: hath-linux-x86_64.AppImage
            updater_glob: "src-tauri/target/release/bundle/appimage/*.AppImage.sig"
            updater_name: hath-linux-x86_64.AppImage.sig
            updater_bundle: ""
          - os: macos-latest
            net_target: darwin-arm64
            rust_targets: aarch64-apple-darwin
            build_args: "--bundles app,dmg --target aarch64-apple-darwin"
            installer_glob: "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg"
            installer_name: hath-macos-aarch64.dmg
            updater_glob: "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig"
            updater_name: hath-macos-aarch64.app.tar.gz.sig
            updater_bundle: "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz"
            updater_bundle_name: hath-macos-aarch64.app.tar.gz
          - os: windows-latest
            net_target: windows-amd64
            rust_targets: ""
            build_args: "--bundles nsis"
            installer_glob: "src-tauri/target/release/bundle/nsis/*setup.exe"
            installer_name: hath-windows-x86_64-setup.exe
            updater_glob: "src-tauri/target/release/bundle/nsis/*setup.exe.sig"
            updater_name: hath-windows-x86_64-setup.exe.sig
            updater_bundle: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: net/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_targets == ''

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_targets != ''
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libfuse2

      - name: Install MinGW (Windows cross-tools for CI host)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          choco install mingw -y --no-progress
          # Chocolatey layout varies by version; put every likely bin dir on PATH.
          for d in \
            /c/ProgramData/mingw64/mingw64/bin \
            /c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin \
            /c/tools/mingw64/bin
          do
            if [ -x "$d/gcc.exe" ] || [ -x "$d/gcc" ]; then
              echo "$d" >> "$GITHUB_PATH"
              echo "Using MinGW at $d"
            fi
          done
          gcc --version
          # Rust windows-gnu target uses this linker name.
          if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
            gcc_path=$(command -v gcc)
            ln -sf "$gcc_path" "$(dirname "$gcc_path")/x86_64-w64-mingw32-gcc"
            ln -sf "$(dirname "$gcc_path")/g++" "$(dirname "$gcc_path")/x86_64-w64-mingw32-g++" || true
          fi
          x86_64-w64-mingw32-gcc --version

      - name: Stamp SemVer from run number
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.0.${{ github.run_number }}"
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version=process.argv[1]; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');" "$VERSION"
          echo "Stamped version ${VERSION}"
          grep '^version' src-tauri/Cargo.toml
          node -p "require('./package.json').version"

      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is required (see .env.github)."
            exit 1
          fi

      - name: Build system mesh binaries (macOS / Linux / Windows)
        shell: bash
        run: |
          set -euo pipefail
          cd net && ./build-tailscale.sh ${{ matrix.net_target }}
          if [ "${{ matrix.net_target }}" = "windows-amd64" ]; then
            test -f ../src-tauri/bin/windows-amd64/wintun.dll
            ls -la ../src-tauri/bin/windows-amd64
          fi

      - run: npm ci
        shell: bash

      - name: Write App Store Connect API key (macOS notarization)
        if: runner.os == 'macOS'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_PRIVATE_KEY}" ] || [ -z "${APPLE_API_KEY_ID}" ]; then
            echo "No App Store Connect API key — skipping notarization key file."
            exit 0
          fi
          KEY_DIR="$HOME/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "APPLE_API_KEY_PATH=$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"

      # Optional macOS Developer ID + notarization (see .env.github).
      # Empty APPLE_* secrets must be unset — Tauri treats an empty
      # APPLE_CERTIFICATE as "please sign" and fails the import.
      # TAURI_SIGNING_* signs updater artifacts (.sig / macOS .app.tar.gz).
      - name: Build desktop installer
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER \
                   APPLE_API_KEY_PATH TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then
              unset "$v"
            fi
          done
          npm run tauri build -- ${{ matrix.build_args }}

      # Vite writes the web build to dist/; do not glob that onto the GitHub
      # Release (index.html, favicons). Installers go in release-assets/.
      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets updater-sigs
          src=$(ls ${{ matrix.installer_glob }} | head -1)
          cp "$src" "release-assets/${{ matrix.installer_name }}"
          sig=$(ls ${{ matrix.updater_glob }} | head -1)
          cp "$sig" "updater-sigs/${{ matrix.updater_name }}"
          if [ -n "${{ matrix.updater_bundle }}" ]; then
            bundle=$(ls ${{ matrix.updater_bundle }} | head -1)
            cp "$bundle" "release-assets/${{ matrix.updater_bundle_name }}"
          fi
          ls -la release-assets updater-sigs

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hath-${{ github.sha }}
          name: Hath ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: release-assets/*

      - name: Share updater signatures
        uses: actions/upload-artifact@v4
        with:
          name: updater-sig-${{ matrix.os }}
          path: updater-sigs/*
          if-no-files-found: error

  release-updater-manifest:
    needs: release-desktop
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download updater signatures
        uses: actions/download-artifact@v4
        with:
          pattern: updater-sig-*
          merge-multiple: true
          path: updater-sigs

      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: hath-${{ github.sha }}
          VERSION: 0.0.${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          export BASE VERSION
          python3 <<'PY'
          import json, pathlib, os
          base = os.environ["BASE"]
          version = os.environ["VERSION"]
          sigs = pathlib.Path("updater-sigs")
          platforms = {
              "linux-x86_64": {
                  "url": f"{base}/hath-linux-x86_64.AppImage",
                  "signature": (sigs / "hath-linux-x86_64.AppImage.sig").read_text().strip(),
              },
              "darwin-aarch64": {
                  "url": f"{base}/hath-macos-aarch64.app.tar.gz",
                  "signature": (sigs / "hath-macos-aarch64.app.tar.gz.sig").read_text().strip(),
              },
              "windows-x86_64": {
                  "url": f"{base}/hath-windows-x86_64-setup.exe",
                  "signature": (sigs / "hath-windows-x86_64-setup.exe.sig").read_text().strip(),
              },
          }
          manifest = {
              "version": version,
              "notes": f"Hath {version}",
              "platforms": platforms,
          }
          out = pathlib.Path("latest.json")
          out.write_text(json.dumps(manifest, indent=2) + "\n")
          print(out.read_text())
          PY
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber

  # IPA + TestFlight on main. No secret preflight — missing Apple materials
  # fail the job the same way a broken Network Extension / VPN build would.
  release-ios:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: net/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build tsnet archive (iOS dialer)
        run: cd net && ./build.sh ios-arm64

      - name: npm ci
        run: npm ci

      - name: Init iOS Xcode project
        run: npm run tauri ios init -- --ci

      # Plain HTTP to *.dadi on the mesh; iOS ATS blocks it without this.
      - name: Allow local/mesh HTTP in Info.plist
        run: |
          set -euo pipefail
          for plist in $(find src-tauri/gen/apple -name 'Info.plist'); do
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$plist"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$plist"
            /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$plist"
            /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Scan a Dadi setup QR to join the mesh." "$plist"
            echo "patched $plist"
          done

      - name: Import iOS signing materials
        env:
          APPLE_IOS_CERTIFICATE: ${{ secrets.APPLE_IOS_CERTIFICATE }}
          APPLE_IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_IOS_CERTIFICATE_PASSWORD }}
          APPLE_IOS_PROVISIONING_PROFILE: ${{ secrets.APPLE_IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/ios-dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/hath.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/hath-ios.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo -n "$APPLE_IOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          echo -n "$APPLE_IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          echo "Installed provisioning profile $PROFILE_UUID"

      - name: Build iOS IPA for TestFlight
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_IOS_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_IOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_IOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run tauri ios build -- \
            --ci \
            --export-method release-testing \
            --build-number "${{ github.run_number }}"

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          IPA=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa found under src-tauri/gen/apple/build"
            exit 1
          fi
          KEY_DIR="$HOME/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "Uploading $IPA to TestFlight…"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"

      - name: Stage IPA
        run: |
          set -euo pipefail
          mkdir -p dist
          IPA=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          cp "$IPA" dist/hath-ios.ipa

      - name: Attach IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hath-${{ github.sha }}
          name: Hath ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: dist/hath-ios.ipa
