name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: hath-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: net/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      # Default ./build.sh is darwin-arm64; the Linux runner needs linux-amd64.
      - name: Build tsnet archive
        run: cd net && ./build.sh linux-amd64

      - run: npm ci

      - run: npm run build

  release:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: net/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Build tsnet archive
        run: cd net && ./build.sh linux-amd64

      - run: npm ci

      # Relocatable binary for /var unpack — not .deb/.rpm (bootc /usr is read-only).
      - name: Build Tauri binary
        run: npm run tauri build -- --no-bundle

      - name: Package tarball
        run: |
          mkdir -p stage
          cp src-tauri/target/release/hath stage/
          tar -C stage -czf hath-linux-x86_64.tar.gz hath

      - name: App version
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Hath v${{ steps.meta.outputs.version }}
          make_latest: true
          overwrite_files: true
          files: hath-linux-x86_64.tar.gz
