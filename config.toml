[runtime]
# How long a POST /router request waits for the router lane before failing.
# Agent lane runs never time out: a wake queued behind a busy lane waits its turn.
lane_queue_timeout_ms = 30000
# The work lane's transcript is a rolling window over the agent's thread: the
# newest messages up to about work_transcript_window_chars (about 2.4 chars a token
# on Haiku 5.5, measured), and never more than the prompt ceiling less trim tokens
# leaves after the agent's own system and the lane's tools, so a long charter means a
# shorter window and the wake keeps its trim headroom. The work lane holds about 42k
# tokens, so its wake keeps about 40k.
# The process lane is the front desk and carries a slim context: its system, a
# recent-thread window that fills what process_context_tokens leaves after the system
# and its tools, its own turns, and the status block hath renders (see runtime/status.ts).
# It never sees the work lane's thinking, tool calls or results.
# Older messages fall out of a window and are reached only through get_logs and memory.
# A window's start moves in jumps of step chars instead of sliding with every message,
# so the provider cache survives everything but the jump.
process_context_tokens = 30000
# The process lane's window never drops below this many chars, however long the charter:
# a coordinator whose budget left it a few thousand chars lost track of its own asks.
process_window_min_chars = 8000
work_transcript_window_chars = 100000
transcript_window_step_chars = 30000
# Backoff after a failed tool call before the agent's next call; doubles per
# consecutive failure and resets on the first success.
tool_debounce_base_ms = 1200
tool_debounce_max_ms = 15000
# Once a wake's tool results still shown in full pass max chars, older results
# are cleared down to the newest kept chars. A cleared result leaves a receipt
# (the call, its size, how it began, and the file read_file reopens it from), so
# clearing loses little; every character still shown is re-read on every call.
# Clearing in one jump keeps the history byte-stable between clears, so the
# provider cache survives every step but the clearing one; a wider gap clears
# less often.
wake_tool_results_max_chars = 48000
wake_tool_results_kept_chars = 16000
# A newer read of the same page tree, page text, screenshot or terminal screen
# marks the older read for replacement at the next cut (a clear, trim or thinking
# drop) only while the older sits within this many of the newest wake turns.
wake_supersede_window_turns = 8
# At boot, a wake a restart cut short is reported to the agent's requester
# only when its last step is this recent; older ones are stale and dropped.
# The report never wakes the requester.
recovery_window_minutes = 10
# A lane's prompt stays under ceiling tokens, below the 100k-token step where
# Haiku's price rises 5x. Each call's measured usage calibrates the next: when
# the next call would pass the ceiling, the oldest steps of the wake leave that
# lane's view until it sits trim tokens under, in one jump so the cached
# prefix holds until the next trim.
prompt_ceiling_tokens = 96000
prompt_trim_tokens = 16000
# Job-shape switches (cycle-4 change). Each turns one runtime behaviour on; false keeps
# the behaviour from before it.
# routine_silence: a wake opened by a recurring schedule's trigger is a routine. It sends
# nothing to agents and at most one message to Ankur, with status blocked or needs_input,
# until someone else's message joins the wake.
routine_silence = true
# direct_agent_messages: the work lane's queue_message to an agent is delivered at once,
# with no process-lane send; the process lane messages an agent only to reply to it.
direct_agent_messages = true
# hath_pickups: when Ankur's latest message to an agent is 180 s old, the agent's work
# lane has acted since it, and the agent has sent him nothing since, hath sends him
# "Working on it." for the agent, once. The lanes send no pickup lines of their own.
hath_pickups = true
# implicit_yield: a process turn of only successful send_message/steer_work calls, and a
# work turn of only successful queue_message calls, ends the run without another model
# call to yield.
implicit_yield = true
# status_job_ledger: the process lane's status block lists the open job's opening
# message, the asks this agent sent in it and who answered, and what it told the requester.
status_job_ledger = true
# ingest_result_wakes: false lets a successful ingest_memory result join the thread without
# waking the lane that saved it (a wake with nothing left to do re-reads and re-reports the
# finished work); a failure always wakes. true wakes the lane on every result.
ingest_result_wakes = false
# direct_ankur_messages: the work lane's queue_message to Ankur is delivered at once, as one to
# an agent is under direct_agent_messages, with its status; the process lane relays nothing.
direct_ankur_messages = true
# pickup_delay_s: how long Ankur's message waits for an answer before hath_pickups sends the
# pickup. With hath_pickups on, a message with status running is refused from both lanes.
pickup_delay_s = 150
# question_answer_minutes: a work lane whose job is Ankur's question may wait on others only
# until this many minutes after his message; the timeout tells it to answer with what it has.
question_answer_minutes = 5
# weekday_guard: a message to Ankur that gives a month and day with no weekday beside it
# (nor today, tonight, tomorrow or yesterday) is refused.
weekday_guard = true

[dwar]
timeout_ms = 330000
retry_attempts = 3
backoff_ms = [500, 1000, 2000]

[yaad]
# ingest triggers a work-lane call inside Yaad, which has its own 330s Dwar timeout.
# This must exceed that or a slow-but-successful extraction gets killed by the caller.
timeout_ms = 360000
retry_attempts = 3
backoff_ms = [500, 1000, 2000]

[ghar]
timeout_ms = 30000
retry_attempts = 3
backoff_ms = [500, 1000, 2000]

[nas]
timeout_ms = 30000
retry_attempts = 3
backoff_ms = [500, 1000, 2000]

[devices]
# How long a device_* tool waits for the target device to POST a command result.
timeout_ms = 30000

[files]
# The box folder agents' files live in, made by writing to it through Nas: incoming
# attachments under attachments/, tool results too large for a prompt under results/,
# and text taken from PDFs under pdf/. It is dadi's own folder, so agents' terminals and
# read_file reach it like any other file.
dir = "/var/home/dadi/.dadi"
# How many days a cache file under results/ or pdf/ is kept before the daily sweep deletes it.
# Attachments are never swept.
cache_retention_days = 30

[schedule]
tick_seconds = 10
