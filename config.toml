[runtime]
# How long a POST /router request waits for the router before failing.
# An agent's run never times out: a wake queued behind a busy agent waits its turn.
router_queue_timeout_ms = 30000
# The thread an agent reads holds every message of its open jobs, whole, then the newest other
# messages up to thread_window_share of prompt_ceiling_tokens (measured in characters at about
# 2.3 characters a token on Haiku 5.5): a quarter of the ceiling is the window, three quarters
# stay for the work. It never holds more than the prompt ceiling less trim tokens leaves after
# the agent's own system and tools. Older messages are reached only through get_logs and memory.
# The window's start of the other messages moves in jumps of thread_window_step_chars instead of
# sliding with every message, so the provider cache survives everything but the jump.
thread_window_share = 0.25
thread_window_step_chars = 30000
# Backoff after a failed tool call before the agent's next call; doubles per
# consecutive failure and resets on the first success.
tool_debounce_base_ms = 1200
tool_debounce_max_ms = 15000
# Once a wake's tool results still shown in full pass max chars, older results
# are cleared down to the newest kept chars. A cleared result leaves a receipt
# (the call, its size, how it began, and the file read_file reopens it from), so
# clearing loses little; every character still shown is re-read on every call.
# Clearing in one jump keeps the history byte-stable between clears, so the
# provider cache survives every step but the clearing one; a wider gap clears
# less often.
wake_tool_results_max_chars = 48000
wake_tool_results_kept_chars = 16000
# A newer read of the same page tree, page text, screenshot or terminal screen
# marks the older read for replacement at the next cut (a clear, trim or thinking
# drop) only while the older sits within this many of the newest wake turns.
wake_supersede_window_turns = 8
# At boot, a wake a restart cut short is reported to the agent's requester
# only when its last step is this recent; older ones are stale and dropped.
# The report never wakes the requester.
recovery_window_minutes = 10
# The prompt stays under ceiling tokens, below the 100k-token step where
# Haiku's price rises 5x. Each call's measured usage calibrates the next: when
# the next call would pass the ceiling, the oldest steps of the wake leave the
# view until it sits trim tokens under, in one jump so the cached
# prefix holds until the next trim.
prompt_ceiling_tokens = 96000
prompt_trim_tokens = 16000
# pickup_delay_s: how long Ankur's job waits for an answer before hath sends him the pickup
# ("Working on it.", a message marked sent_by hath) for the agent, once per job, and only while the
# agent is running or waiting on something pending. Agents send no pickup lines of their own.
pickup_delay_s = 180
# answer_by_minutes: a job Ankur opens is due this many minutes after his message (jobs.answer_by).
# The wake header shows the time, and when it passes with the job still open hath wakes the agent
# with what has and has not come in. Five minutes is Ankur's policy for his questions; it depends
# on the requester, never on the agent.
answer_by_minutes = 5
# activity_hours: the wake header's [Your recent activity] lists what the agent did this many
# hours back, newest first (see runtime/activity.ts).
activity_hours = 24
# activity_ceiling_share: the most of the prompt ceiling that list (and a my_activity result) may
# take, as a fraction of prompt_ceiling_tokens: a window is a share of the ceiling.
activity_ceiling_share = 0.05

[dwar]
timeout_ms = 330000
retry_attempts = 3
backoff_ms = [500, 1000, 2000]

[yaad]
# ingest triggers a model call inside Yaad, which has its own 330s Dwar timeout.
# This must exceed that or a slow-but-successful extraction gets killed by the caller.
timeout_ms = 360000
retry_attempts = 3
backoff_ms = [500, 1000, 2000]

[ghar]
timeout_ms = 30000
retry_attempts = 3
backoff_ms = [500, 1000, 2000]

[nas]
timeout_ms = 30000
retry_attempts = 3
backoff_ms = [500, 1000, 2000]

[devices]
# How long a device_* tool waits for the target device to POST a command result.
timeout_ms = 30000

[files]
# The box folder hath keeps its caches in, made by writing to it through Nas: tool results
# too large for a prompt under results/ and text taken from PDFs under pdf/. It is dadi's
# own folder, so agents' terminals and read_file reach it like any other file. Ankur's
# uploads are not here: they land in ~/Inbox/<yyyy-mm>/, browser downloads in
# ~/Inbox/Downloads/.
dir = "/var/home/dadi/.dadi"
# How many days a cache file under results/ or pdf/ is kept before the daily sweep deletes it.
cache_retention_days = 30

[schedule]
tick_seconds = 10
