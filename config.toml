[runtime]
# How long a POST /router request waits for the router lane before failing.
# Agent lane runs never time out: a wake queued behind a busy lane waits its turn.
lane_queue_timeout_ms = 30000
# An agent's transcript is a rolling window over its thread: the newest
# messages up to about max chars (about 4 chars a token). Older messages fall
# out and are reached only through get_logs and memory. The window's start
# moves in jumps of step chars instead of sliding with every message, so the
# provider cache survives everything but the jump.
transcript_window_chars = 120000
transcript_window_step_chars = 30000
# Backoff after a failed tool call before the agent's next call; doubles per
# consecutive failure and resets on the first success.
tool_debounce_base_ms = 1200
tool_debounce_max_ms = 15000
# Once a wake's tool results still shown in full pass max chars, older results
# are cleared down to the newest kept chars. Clearing in one jump keeps the
# history byte-stable between clears, so the provider cache survives every
# step but the clearing one; a wider gap clears less often.
wake_tool_results_max_chars = 60000
wake_tool_results_kept_chars = 15000
# A newer read of the same page tree, page text, screenshot or terminal screen
# replaces the older read only while the older sits within this many of the
# newest wake turns: further back, the cache rewrite it causes falls outside
# the provider's 20-position lookback and rewrites the whole wake.
wake_supersede_window_turns = 8
# At boot, a wake a restart cut short is reported to the agent's requester
# only when its last step is this recent; older ones are stale and dropped.
# The report never wakes the requester.
recovery_window_minutes = 10

[dwar]
timeout_ms = 330000
retry_attempts = 3
backoff_ms = [500, 1000, 2000]

[yaad]
# ingest triggers a reasoning call inside Yaad, which has its own 330s Dwar timeout.
# This must exceed that or a slow-but-successful extraction gets killed by the caller.
timeout_ms = 360000
retry_attempts = 3
backoff_ms = [500, 1000, 2000]

[ghar]
timeout_ms = 30000
retry_attempts = 3
backoff_ms = [500, 1000, 2000]

[chaavi]
timeout_ms = 30000
retry_attempts = 3
backoff_ms = [500, 1000, 2000]

[nas]
timeout_ms = 30000
retry_attempts = 3
backoff_ms = [500, 1000, 2000]

[devices]
# How long a device_* tool waits for the target device to POST a command result.
timeout_ms = 30000

[browser]
action_timeout_ms = 5000
navigation_timeout_ms = 30000
snapshot_max_bytes = 32768
# How long browser_click with read waits for the click to start a navigation
# (then waits for load) or, without one, for the page to redraw in place.
click_settle_ms = 750

[schedule]
tick_seconds = 10
